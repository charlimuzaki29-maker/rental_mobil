  <path d="M 80 230 L 80 160 C 80 145, 100 135, 130 130 L 260 120 L 390 120 L 470 160 L 530 195 C 540 205, 540 225, 538 245 L 535 255 C 520 258, 500 258, 480 258 C 470 225, 425 225, 415 258 L 215 258 C 205 225, 160 225, 150 258 L 85 258 C 80 250, 80 240, 80 230 Z" fill="url(#mpvGrad)"/>
